name: 무신사 후기 감시

on:
  schedule:
    # GitHub Actions 의 cron 은 UTC 기준. 1시간마다 실행.
    # 러너가 붐비면 수 분~수십 분 늦게 도는데, 신규 판별이 시간이 아니라
    # 후기 번호 기준이라 지연되거나 한 번 건너뛰어도 누락되지 않는다.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: true
        default: "normal"
        type: choice
        options:
          - normal        # 신규 후기 확인 후 있으면 메일 발송
          - init          # 알림 없이 현재 시점을 기준선으로 저장
          - dry-run       # 메일 없이 로그로만 확인
          - test-email    # 설정 확인용 테스트 메일

concurrency:
  group: musinsa-review-watch
  cancel-in-progress: false

permissions:
  contents: write        # state.json 커밋에 필요

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 후기 확인
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          case "${{ github.event.inputs.mode || 'normal' }}" in
            init)       python watcher.py --init ;;
            dry-run)    python watcher.py --dry-run ;;
            test-email) python watcher.py --test-email ;;
            *)          python watcher.py ;;
          esac

      - name: 상태 파일 커밋
        if: ${{ github.event.inputs.mode != 'dry-run' && github.event.inputs.mode != 'test-email' }}
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json 변경 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: 후기 감시 상태 갱신 [skip ci]"
          # 다른 실행이 먼저 커밋했을 수 있으므로 rebase 후 푸시
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
